<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>音帝庙大冒险</title>
<style>
:root{
  --gold:#ffd479; --gold2:#ffb02e; --ink:#0a0e18; --ink2:#121a2c; --line:#2a3854;
  --txt:#e9f0ff; --dim:#93a4c4; --red:#ff5c72; --green:#57e08a; --blue:#5cc8ff;
  --safeT: env(safe-area-inset-top, 0px);
  --safeB: env(safe-area-inset-bottom, 0px);
  --safeL: env(safe-area-inset-left, 0px);
  --safeR: env(safe-area-inset-right, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#04060c;color:var(--txt);
  font-family:"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden}
canvas#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:1}
.hidden{display:none !important}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;z-index:5;pointer-events:none}
.hud-top{position:absolute;top:calc(6px + var(--safeT));left:calc(8px + var(--safeL));right:calc(8px + var(--safeR));
  display:flex;align-items:flex-start;gap:8px}
.hud-left{flex:1;min-width:0;max-width:44%}
.bar{position:relative;height:16px;border-radius:9px;background:#0d1424cc;border:1.5px solid #33507e;
  overflow:hidden;box-shadow:0 2px 8px #0008, inset 0 0 10px #0006}
.bar.xp{height:9px;margin-top:4px;border-color:#3d6a4e}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:8px;transition:width .12s linear}
.bar.hp .fill{background:linear-gradient(180deg,#ff8a9a,#e0243f);box-shadow:0 0 12px #ff335588}
.bar .shieldfill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(180deg,#9fe6ff,#2b90d8);opacity:.9}
.bar.xp .fill{background:linear-gradient(180deg,#8dffb0,#22a85a);box-shadow:0 0 10px #33ff8844}
.bar-txt{position:absolute;inset:0;font-size:11px;line-height:16px;text-align:center;font-weight:700;
  text-shadow:0 1px 2px #000c;letter-spacing:.5px}
.lvtag{display:inline-block;margin-top:4px;font-size:10px;font-weight:800;color:#08101c;background:linear-gradient(180deg,var(--gold),var(--gold2));
  border-radius:6px;padding:1px 7px;box-shadow:0 2px 6px #0008}
.hud-mid{flex:0 0 auto;text-align:center;padding-top:2px}
.stage{font-size:13px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 6px #000, 0 0 14px #ffcf7a44;color:#ffe9bd}
.sub{font-size:10px;color:var(--dim);margin-top:2px;text-shadow:0 1px 3px #000}
.hud-right{flex:0 0 auto;display:flex;align-items:center;gap:6px;pointer-events:auto}
.coins{font-size:12px;font-weight:800;background:#0d1424cc;border:1.5px solid #4a5a3a;border-radius:9px;
  padding:3px 8px;color:var(--gold);text-shadow:0 1px 3px #000}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:#0d1424dd;
  color:var(--txt);font-size:15px;display:grid;place-items:center;cursor:pointer;pointer-events:auto}
.iconbtn:active{transform:scale(.94)}
#skillBar{position:absolute;left:calc(8px + var(--safeL));bottom:calc(6px + var(--safeB));display:flex;flex-wrap:wrap;gap:4px;max-width:60%}
#skillBar2{position:absolute;right:calc(8px + var(--safeR));bottom:calc(6px + var(--safeB));display:flex;flex-wrap:wrap;gap:4px;max-width:34%;justify-content:flex-end}
.hud-p2{margin-top:5px;width:100%}
.bar.p2 .fill{background:linear-gradient(180deg,#8fd0ff,#2b7fd8);box-shadow:0 0 12px #4ab6ff88}
.bar.p2{border-color:#4a86c8}
.bar.p2.xp{border-color:#3d5a8e}
.bar.p2.xp .fill{background:linear-gradient(180deg,#9fc4ff,#4b6fd8)}
.lvtag.p2{background:linear-gradient(180deg,#9fd8ff,#3d8fd6);color:#04121f}
.skchip.p2{border-color:#4a86c8;background:#0d1a2ce0}
.stick-base.p2{border-color:#8fd0ff55;background:radial-gradient(circle,#4ab6ff18,#4ab6ff05 70%,transparent)}
.stick-knob.p2{background:radial-gradient(circle at 36% 32%,#ffffffcc,#4a9fdd88);border-color:#8fd0ff77;box-shadow:0 0 18px #4ab6ff66}
#btnDash2{position:absolute;right:calc(16px + var(--safeR));bottom:calc(24px + var(--safeB));width:74px;height:74px;border-radius:50%;
  border:2px solid #8fd0ff88;background:radial-gradient(circle at 40% 35%,#2c6f9ecc,#0d2233dd);color:#dff3ff;font-size:26px;
  pointer-events:auto;box-shadow:0 6px 18px #0009, 0 0 22px #46c6ff44;display:grid;place-items:center;transition:transform .08s}
#btnDash2:active{transform:scale(.92)}
#btnDash2.cd{filter:grayscale(.8) brightness(.6)}
/* 双人时：P1 冲刺键移到左下，给 P2 让出右下 */
#hud.two-p #btnDash{left:calc(16px + var(--safeL));right:auto;bottom:calc(58px + var(--safeB))}
#hud.two-p #skillBar{bottom:calc(6px + var(--safeB));max-width:52%}
.skchip{width:32px;height:32px;border-radius:9px;background:#0d1424e0;border:1.5px solid #3a4f78;display:grid;place-items:center;
  font-size:15px;position:relative;box-shadow:0 2px 6px #0007}
.skchip b{position:absolute;right:-6px;bottom:-6px;min-width:16px;height:16px;line-height:15px;text-align:center;
  font-size:11px;background:linear-gradient(180deg,#ffe08a,#ffab2e);color:#241704;border-radius:9px;
  padding:0 4px;font-weight:900;border:1.5px solid #00000088;box-shadow:0 2px 5px #000a}

/* 摇杆 */
#stick{position:absolute;z-index:6;width:150px;height:150px;margin-left:-75px;margin-top:-75px;pointer-events:none}
.stick-base{position:absolute;inset:0;border-radius:50%;border:2px solid #ffffff2e;background:radial-gradient(circle,#ffffff14,#ffffff05 70%,transparent)}
.stick-knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#ffffffcc,#7fa6dd77);border:2px solid #ffffff55;box-shadow:0 0 18px #7fd0ff55}
#btnDash{position:absolute;right:calc(16px + var(--safeR));bottom:calc(24px + var(--safeB));width:74px;height:74px;border-radius:50%;
  border:2px solid #6fd7ff88;background:radial-gradient(circle at 40% 35%,#2c6f9ecc,#0d2233dd);color:#dff3ff;font-size:26px;
  pointer-events:auto;box-shadow:0 6px 18px #0009, 0 0 22px #46c6ff44;display:grid;place-items:center;transition:transform .08s}
#btnDash:active{transform:scale(.92)}
#btnDash.cd{filter:grayscale(.8) brightness(.6)}

/* ---------- 覆盖界面 ---------- */
#overlay{position:absolute;inset:0;z-index:20;display:none;overflow:hidden}
#overlay.show{display:block}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(10px + var(--safeT)) calc(12px + var(--safeR)) calc(10px + var(--safeB)) calc(12px + var(--safeL));
  background:radial-gradient(120% 90% at 50% 0%,#16233ccc,#05070e 70%),#05070e;overflow-y:auto;overscroll-behavior:contain}
.screen.dim{background:#03060cd9;backdrop-filter:blur(3px)}
h1.title{font-size:clamp(26px,7vw,46px);font-weight:900;letter-spacing:4px;line-height:1.1;
  background:linear-gradient(180deg,#fff3d0,#ffb02e 60%,#b96a12);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 14px #ff9a2e55)}
.subtitle{color:#c9d7f0;font-size:12px;letter-spacing:3px;margin:6px 0 18px;opacity:.85}
.btn{min-width:190px;padding:12px 22px;margin:6px;border-radius:14px;border:1.5px solid #6b7fa8;cursor:pointer;
  background:linear-gradient(180deg,#28395c,#161f34);color:#eaf1ff;
  font-size:15px;font-weight:800;letter-spacing:1px;box-shadow:0 4px 14px #0008;transition:transform .08s}
.btn:active{transform:translateY(2px) scale(.985)}
.btn.primary{border-color:#ffd479aa;background:linear-gradient(180deg,#ffca5c,#e08a12);color:#20160a;
  box-shadow:0 6px 20px #ffa62e55, inset 0 1px 0 #fff8}
.btn.ghost{background:#131c2f;border-color:#3a4f78;color:#c9d7f0}
.btn.small{min-width:auto;padding:8px 14px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.45;filter:grayscale(.6)}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px}
.panel{width:min(680px,96vw);background:linear-gradient(180deg,#101a2ccc,#0a1120ee);border:1.5px solid #2c3b5c;
  border-radius:16px;padding:12px;box-shadow:0 10px 40px #000a;margin:8px 0}
.panel h2{font-size:14px;color:var(--gold);letter-spacing:2px;margin-bottom:8px;text-align:center;font-weight:900}
.grid-lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:7px;width:100%}
.lvcell{aspect-ratio:1/1;border-radius:12px;border:1.5px solid #3a4f78;background:linear-gradient(180deg,#1b2740,#111a2c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:14px;cursor:pointer}
.lvcell small{font-size:9px;color:var(--dim);font-weight:600}
.lvcell.boss{border-color:#c46bff88;box-shadow:0 0 14px #a855f755 inset}
.lvcell.locked{opacity:.42;cursor:not-allowed}
.lvcell.done{border-color:#4ee39a88;background:linear-gradient(180deg,#123326,#0d2119)}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:11px;border:1.5px solid #3a4f78;background:#131c2f;font-size:12px;font-weight:800;cursor:pointer}
.tab.on{background:linear-gradient(180deg,#ffca5c,#e08a12);color:#20160a;border-color:#ffd479aa}
.cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}
.card{width:min(210px,44vw);min-height:170px;border-radius:16px;padding:14px 10px;cursor:pointer;
  background:linear-gradient(180deg,#1a2540,#0d1424);border:2px solid #3a4f78;display:flex;flex-direction:column;align-items:center;
  gap:6px;text-align:center;box-shadow:0 8px 26px #0009;transition:transform .1s}
.card:active{transform:scale(.97)}
.card .ic{font-size:34px;filter:drop-shadow(0 3px 8px #000a)}
.card .nm{font-size:15px;font-weight:900;color:#fff}
.card .ds{font-size:11.5px;color:#b9c8e4;line-height:1.5}
.card .rr{font-size:10px;font-weight:900;padding:2px 8px;border-radius:7px;margin-top:auto;letter-spacing:1px}
.card .stackline{font-size:10.5px;color:#9fb2d4;background:#ffffff0f;border:1px dashed #ffffff2e;border-radius:8px;padding:3px 6px;width:100%}
.r1{border-color:#5b7fb0}.r1 .rr{background:#37507a;color:#dbe8ff}
.r2{border-color:#7d6bff}.r2 .rr{background:#4b3fbb;color:#e6e0ff}
.r3{border-color:#ffb84d;box-shadow:0 0 22px #ffab2e44}.r3 .rr{background:#a86a10;color:#fff2d0}
.attrrow{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.abadge{font-size:10px;font-weight:900;padding:1px 6px;border-radius:7px;background:#0d1424cc;border:1px solid #ffffff22;text-shadow:0 1px 2px #000}
.skchip .abartag{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:9px 0 0 9px}
.stack{position:absolute}
.list{display:flex;flex-direction:column;gap:7px;width:100%;max-height:46vh;overflow-y:auto;padding-right:2px}
.item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:13px;background:#152036;border:1.5px solid #34486e}
.item .ic{font-size:24px;width:32px;text-align:center}
.item .tx{flex:1;min-width:0}
.item .nm{font-size:13.5px;font-weight:800}
.item .ds{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.45}
.pill{font-size:11px;font-weight:800;color:#0e141f;background:linear-gradient(180deg,var(--gold),var(--gold2));border-radius:9px;padding:5px 10px;white-space:nowrap}
.pill.off{background:#26324a;color:#8ea0c0}
.tip{font-size:11px;color:var(--dim);line-height:1.7;text-align:center;max-width:600px}
.nameinput{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid #3a4f78;background:#0e1729;color:#e9f0ff;
  font-size:16px;text-align:center;font-weight:700;letter-spacing:1px;outline:none}
.nameinput:focus{border-color:#ffd479aa;box-shadow:0 0 0 3px #ffd47922}
.kbd{display:inline-block;background:#1d2942;border:1px solid #3d527a;border-radius:5px;padding:0 5px;font-size:11px;margin:0 1px}
#toast{position:absolute;left:50%;top:calc(18% + var(--safeT));transform:translateX(-50%);z-index:30;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:6px}
.tmsg{background:#0d1424e6;border:1.5px solid #ffd47966;color:#ffe9bd;border-radius:11px;padding:7px 14px;font-size:13px;
  font-weight:800;box-shadow:0 6px 20px #000a;animation:tin .3s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wide{width:100%;display:flex;justify-content:center}
.scroll{width:100%;overflow-y:auto}
@media (max-height:430px){
  h1.title{font-size:24px}.subtitle{margin-bottom:8px}
  .btn{padding:9px 16px;font-size:13.5px;min-width:150px;margin:4px}
  .card{min-height:130px}.card .ic{font-size:26px}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-left">
        <div class="bar hp"><div class="fill" id="hpFill"></div><div class="shieldfill" id="shFill"></div>
          <div class="bar-txt" id="hpTxt">100/100</div></div>
        <div class="bar xp"><div class="fill" id="xpFill" style="width:0%"></div></div>
        <div class="lvtag" id="lvTag">P1 · Lv.1</div>
        <div class="attrrow" id="attrRow"></div>
      </div>
      <div class="hud-mid">
        <div class="stage" id="stageTxt">幽暗森林 1-1</div>
        <div class="sub" id="roomTxt">房间 1/4</div>
      </div>
      <div class="hud-right">
        <div class="coins" id="coinTxt">🪙 0</div>
        <button class="iconbtn" id="btnPause">⏸</button>
      </div>
    </div>
    <div class="hud-p2 hidden" id="p2hud">
      <div class="bar hp p2"><div class="fill" id="hpFill2"></div><div class="shieldfill" id="shFill2"></div>
        <div class="bar-txt" id="hpTxt2">100/100</div></div>
      <div class="bar xp p2"><div class="fill" id="xpFill2" style="width:0%"></div></div>
      <div class="lvtag p2" id="lvTag2">P2 · Lv.1</div>
      <div class="attrrow" id="attrRow2"></div>
    </div>
    <div id="skillBar"></div>
    <div id="skillBar2" class="hidden"></div>
    <button id="btnDash" class="hidden">💨</button>
    <button id="btnDash2" class="hidden">💨</button>
    <div id="stick" class="hidden"><div class="stick-base"></div><div class="stick-knob" id="stickKnob"></div></div>
    <div id="stick2" class="hidden"><div class="stick-base p2"></div><div class="stick-knob p2" id="stickKnob2"></div></div>
  </div>

  <div id="overlay"></div>
  <div id="toast"></div>
</div>

<script>
"use strict";
/* =========================================================================
   弓箭传说 · 复刻版（单文件 H5）
   ========================================================================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (a) => a[(Math.random() * a.length) | 0];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const dist2 = (a, b) => (a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y);
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = (n) => (n >= 10000 ? (n / 1000).toFixed(1) + "k" : Math.round(n).toString());
/* 关卡布局专用随机源：好友挑战时替换为同一颗种子，保证两人遇到完全相同的关卡 */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seedFromString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
let LR = Math.random;                       // layout rng
function setLayoutSeed(seed) { LR = seed ? mulberry32(seedFromString(String(seed).toUpperCase())) : Math.random; }
const Lrand = (a, b) => a + LR() * (b - a);
const LrandInt = (a, b) => Math.floor(a + LR() * (b - a + 1));
const Lpick = (arr) => arr[(LR() * arr.length) | 0];

/* ======================= 存档 ======================= */
const SAVE_KEY = "archery_legend_v1";
function defaultSave() {
  return {
    coins: 0,
    weapon: "bow",
    weapons: { bow: 1 },
    perm: { atk: 0, hp: 0, speed: 0, aspd: 0, luck: 0, revive: 0, crit: 0 },
    progress: {},          // {"1-3":true}
    unlocked: { 1: 1 },    // 每章解锁到第几关
    chapter: 1, level: 1,
    sound: true, best: 0, endlessBest: 0, endlessUnlocked: false,
    playerName: "", challenges: []
  };
}
let save = defaultSave();
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) {
    const o = JSON.parse(raw);
    save = Object.assign(defaultSave(), o);
    save.perm = Object.assign(defaultSave().perm, o.perm || {});
    save.weapons = Object.assign({ bow: 1 }, o.weapons || {});
    save.unlocked = Object.assign({ 1: 1 }, o.unlocked || {});
    save.progress = o.progress || {};
  }
} catch (e) { console.warn("存档读取失败", e); }
let saveTimer = 0, lastSaveAt = 0;
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); lastSaveAt = Date.now(); }
  catch (e) { console.warn("存档写入失败", e); }
}
/* 高频事件（拾取金币）走节流，重要事件立即落盘，切后台/关页也会强制写入 */
function persist(force) {
  const now = Date.now();
  clearTimeout(saveTimer);
  if (force || now - lastSaveAt > 400) { writeSave(); return; }
  saveTimer = setTimeout(writeSave, 400);
}
window.addEventListener("pagehide", () => writeSave());
window.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") writeSave(); });

/* ======================= 音效（WebAudio 合成） ======================= */
const Sfx = {
  ctx: null, master: null,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.22;
      this.master.connect(this.ctx.destination);
    } catch (e) { }
  },
  resume() { if (this.ctx && this.ctx.state === "suspended") this.ctx.resume().catch(() => { }); },
  tone(freq, dur, type, vol, slide) {
    if (!save.sound) return;
    this.init(); if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, hp) {
    if (!save.sound) return;
    this.init(); if (!this.ctx) return;
    const t = this.ctx.currentTime, n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const g = this.ctx.createGain(); g.gain.value = vol || 0.3;

/* 单人：屏幕任意位置拖动。双人：左半屏 = P1，右半屏 = P2，各自独立触点。 */
function makeStick(node, knob) {
  return {
    active: false, id: -1, ox: 0, oy: 0, dx: 0, dy: 0, mag: 0, node: node, knob: knob,
    maxR() { return clamp(Math.min(V.w, V.h) * 0.15, 38, 76); },
    start(id, x, y) {
      this.active = true; this.id = id; this.ox = x; this.oy = y;
      this.node.classList.remove("hidden");
      this.node.style.left = x + "px"; this.node.style.top = y + "px";
      this.node.style.transform = "scale(" + (this.maxR() * 2 / 150).toFixed(3) + ")";
      this.update(x, y);
    },
    update(x, y) {
      if (!this.active) return;
      const R = this.maxR();
      let dx = x - this.ox, dy = y - this.oy;
      const m = Math.hypot(dx, dy);
      if (m > R) { this.ox += (dx / m) * (m - R) * 0.55; this.oy += (dy / m) * (m - R) * 0.55; }
      this.node.style.left = this.ox + "px"; this.node.style.top = this.oy + "px";
      dx = x - this.ox; dy = y - this.oy;
      const m2 = Math.hypot(dx, dy) || 1;
      const k = Math.min(m2, R) / R;
      this.mag = k;
      if (m2 > 4) { this.dx = (dx / m2) * k; this.dy = (dy / m2) * k; } else { this.dx = 0; this.dy = 0; this.mag = 0; }
      this.knob.style.transform = "translate(" + (dx / m2) * Math.min(m2, R) + "px," + (dy / m2) * Math.min(m2, R) + "px)";
    },
    end(id) {
      if (id !== undefined && id !== this.id) return;
      this.active = false; this.id = -1; this.dx = this.dy = 0; this.mag = 0;
      this.node.classList.add("hidden");
      this.knob.style.transform = "none";
    }
  };
}
const Input = {
  sticks: [],                 // [P1, P2]
  keys: {},
  init() {
    this.sticks = [makeStick(el.stick, el.stickKnob), makeStick(el.stick2, el.stickKnob2)];
  },
  stickFor(idx) { return this.sticks[idx]; },
  dir(idx) {
    const s = this.sticks[idx] || this.sticks[0];
    let x = s ? s.dx : 0, y = s ? s.dy : 0;
    const k = this.keys;
    // 双人：P1 只用 WASD、P2 只用方向键，互不抢键；单人：P1 同时吃两套键
    const K = idx === 0
      ? (G.twoP ? [["a", "A", null, -1, 0], ["d", "D", null, 1, 0], ["w", "W", null, 0, -1], ["s", "S", null, 0, 1]]
                : [["a", "A", "ArrowLeft", -1, 0], ["d", "D", "ArrowRight", 1, 0], ["w", "W", "ArrowUp", 0, -1], ["s", "S", "ArrowDown", 0, 1]])
      : [["ArrowLeft", null, null, -1, 0], ["ArrowRight", null, null, 1, 0], ["ArrowUp", null, null, 0, -1], ["ArrowDown", null, null, 0, 1]];
    for (const g of K) {
      if ((g[0] && k[g[0]]) || (g[1] && k[g[1]]) || (g[2] && k[g[2]])) { x += g[3]; y += g[4]; }
    }
    const m = Math.hypot(x, y);
    if (m < 0.001) return { x: 0, y: 0, m: 0 };
    return { x: x / m, y: y / m, m: Math.min(1, m) };
  },
  endAll() { this.sticks.forEach((s) => s && s.end()); }
};

  const roomCount = 3 + (lv >= 6 ? 1 : 0);
  const rooms = [];
  for (let i = 0; i < roomCount; i++) {
    const last = i === roomCount - 1;
    if (last && bossLv) {
      const b = BOSSES[(ch - 1) % BOSSES.length];
      rooms.push({ boss: b.id, name: b.name, kind: "boss" });
      continue;
    }
    const waves = [];
    const waveN = 1 + (lv >= 5 ? 1 : 0);
    for (let w = 0; w < waveN; w++) {
      const cnt = DIFF.countBase + Math.floor(lv * DIFF.countPerLv) + w;
      const list = [];

      let left = Math.min(cnt, 9);
      while (left > 0) {
        const t = Lpick(pool);

        list.push({ t: t, n: k });
        left -= k;

      waves.push(list);

    const elite = (!last && lv >= 3 && i === Math.floor(roomCount / 2) - 0 && LR() < DIFF.eliteChance + lv * 0.015);

}

function updateEBullets(dt) {

  const key = G.chapter + "-" + G.level;
  const first = !save.progress[key];

  let bonus = Math.round(60 + tierOf(G.chapter, G.level, 0) * 8);

/* ======================= 主循环 ======================= */
let lastT = performance.now();
function frame(now) {
  const rawDt = Math.min(0.034, Math.max(0.0001, (now - lastT) / 1000));
  lastT = now;
  G.dt = rawDt;
  if (G.state === "playing") {
    G.time += rawDt;
    G.runTime += rawDt;
    for (const p of players) updatePlayer(p, rawDt);
    updateArrows(rawDt);
    updateEnemies(rawDt);
    updateEBullets(rawDt);
    updatePickups(rawDt);
    updateParts(rawDt);
    checkRoomFlow(rawDt);
    updateHud();
    if (G.shake > 0) G.shake = Math.max(0, G.shake - rawDt * 42);
  } else {
    updateParts(rawDt * 0.4);
    if (G.shake > 0) G.shake = Math.max(0, G.shake - rawDt * 30);
  }
  render();
  requestAnimationFrame(frame);
}

/* ======================= 暂停 / 继续 ======================= */

function resumeGame() {
  if (G.state !== "paused") return;
  G.state = "playing";

}
el.btnPause.addEventListener("click", pauseGame);
el.btnDash.addEventListener("pointerdown", (e) => { e.preventDefault(); doDash(0); });

/* ======================= 渲染 ======================= */
let bgCache = { w: 0, h: 0, ch: -1, grad: null };

function drawBackground(w, h) {

    const g = ctx2d.createLinearGradient(0, 0, w * 0.35, h);

      ctx2d.moveTo(p.x, p.y + bob + s);
      ctx2d.bezierCurveTo(p.x - s * 1.7, p.y + bob - s * 0.3, p.x - s * 0.55, p.y + bob - s * 1.5, p.x, p.y + bob - s * 0.45);
      ctx2d.bezierCurveTo(p.x + s * 0.55, p.y + bob - s * 1.5, p.x + s * 1.7, p.y + bob - s * 0.3, p.x, p.y + bob + s);
      ctx2d.fill(); ctx2d.shadowBlur = 0;
    }
  }
}
function drawParticles() {
  for (const p of parts) {
    const t = clamp(p.life / p.max, 0, 1);
    ctx2d.globalAlpha = t;
    if (p.glow) { ctx2d.shadowColor = p.color; ctx2d.shadowBlur = 8; }
    ctx2d.fillStyle = p.color;
    ctx2d.beginPath(); ctx2d.arc(p.x, p.y, p.size * t, 0, TAU); ctx2d.fill();
    ctx2d.shadowBlur = 0;
  }
  ctx2d.globalAlpha = 1;
}
function drawEffects() {
  for (const f of effects) {
    const t = clamp(f.life / f.max, 0, 1);
    if (f.type === "ring") {
      ctx2d.globalAlpha = t * 0.85;
      ctx2d.strokeStyle = f.color; ctx2d.lineWidth = 3 + 5 * t;
      ctx2d.beginPath(); ctx2d.arc(f.x, f.y, f.r * (1.15 - t * 0.75), 0, TAU); ctx2d.stroke();
      ctx2d.globalAlpha = 1;
    } else if (f.type === "bolt") {
      ctx2d.globalAlpha = t;
      ctx2d.strokeStyle = f.color; ctx2d.lineWidth = 4; ctx2d.shadowColor = f.color; ctx2d.shadowBlur = 14;
      ctx2d.beginPath();
      f.pts.forEach((p, i) => (i ? ctx2d.lineTo(p.x, p.y) : ctx2d.moveTo(p.x, p.y)));
      ctx2d.stroke();
      ctx2d.lineWidth = 1.6; ctx2d.strokeStyle = "#ffffff";
      ctx2d.stroke();
      ctx2d.shadowBlur = 0; ctx2d.globalAlpha = 1;
    }
  }
}
function drawFloats() {
  ctx2d.textAlign = "center"; ctx2d.textBaseline = "middle";
  for (const f of floats) {
    const t = clamp(f.life / f.max, 0, 1);
    ctx2d.globalAlpha = t;
    ctx2d.font = (f.crit ? "900 " : "800 ") + f.size.toFixed(0) + "px system-ui,sans-serif";
    ctx2d.lineWidth = 3; ctx2d.strokeStyle = "#000000bb";
    ctx2d.strokeText(f.txt, f.x, f.y);
    ctx2d.fillStyle = f.color;
    ctx2d.fillText(f.txt, f.x, f.y);
  }
  ctx2d.globalAlpha = 1;
}
function drawBossBar() {
  const boss = enemies.find((e) => e.boss && !e.dead);
  if (!boss) return;
  const w = Math.min(V.w * 0.66, 460), h = 12;
  const x = (V.w - w) / 2, y = 78 + (V.safeTop || 0);
  ctx2d.fillStyle = "#00000099"; ctx2d.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx2d.fillStyle = "#3a0f1a"; ctx2d.fillRect(x, y, w, h);
  const g = ctx2d.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, "#ff5c72"); g.addColorStop(1, "#ffb04d");
  ctx2d.fillStyle = g;
  ctx2d.fillRect(x, y, w * clamp(boss.hp / boss.maxHp, 0, 1), h);
  ctx2d.strokeStyle = "#ffffff55"; ctx2d.lineWidth = 1.5; ctx2d.strokeRect(x, y, w, h);
  ctx2d.fillStyle = "#fff"; ctx2d.font = "700 11px system-ui,sans-serif"; ctx2d.textAlign = "center"; ctx2d.textBaseline = "bottom";
  ctx2d.fillText(boss.name + "   " + Math.ceil(boss.hp) + " / " + Math.ceil(boss.maxHp), V.w / 2, y - 3);
}
function drawBossIntro() {
  if (!bossIntro) return;
  bossIntro.t -= G.dt;
  if (bossIntro.t <= 0) { bossIntro = null; return; }
  const a = clamp(bossIntro.t / 0.6, 0, 1);
  ctx2d.save();
  ctx2d.globalAlpha = a;
  ctx2d.fillStyle = "#00000088"; ctx2d.fillRect(0, V.h * 0.36, V.w, 74 * V.scale);
  ctx2d.fillStyle = "#ff5c72";
  ctx2d.font = "900 " + (24 * V.scale).toFixed(0) + "px system-ui,sans-serif";
  ctx2d.textAlign = "center"; ctx2d.textBaseline = "middle";
  ctx2d.shadowColor = "#ff5c72"; ctx2d.shadowBlur = 18;
  ctx2d.fillText("BOSS", V.w / 2, V.h * 0.36 + 20 * V.scale);
  ctx2d.fillStyle = "#ffe9bd";
  ctx2d.font = "800 " + (16 * V.scale).toFixed(0) + "px system-ui,sans-serif";
  ctx2d.fillText(bossIntro.name, V.w / 2, V.h * 0.36 + 52 * V.scale);
  ctx2d.shadowBlur = 0;
  ctx2d.restore();
}

function requestFull() {
  try {
    const e = document.documentElement;
    if (!document.fullscreenElement) {
      (e.requestFullscreen || e.webkitRequestFullscreen || function () { }).call(e);
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => { });

  setTimeout(resize, 400);
}

function rollChoices(p, n, color) {
  const s = p.st;
  const usable = (sk) => {
    const cnt = p.skills[sk.id] || 0;
    if (cnt >= sk.max) return false;
    if (sk.req && !sk.req(s)) return false;
    if (sk.id === "dash" && (p.skills.dash || 0) >= 1) return false;
    return true;
  };
  const wOf = (sk) => (sk.r === 1 ? 100 : sk.r === 2 ? 46 : 15) * (1 + (p.skills[sk.id] || 0) * -0.08);
  const draw = (list, want) => {
    const tmp = list.slice(), got = [];
    while (got.length < want && tmp.length) {
      let total = 0; for (const sk of tmp) total += wOf(sk);
      let r = Math.random() * total, chosen = tmp[0];
      for (const sk of tmp) { r -= wOf(sk); if (r <= 0) { chosen = sk; break; } }
      got.push(chosen); tmp.splice(tmp.indexOf(chosen), 1);
    }
    return got;
  };
  // 主池：所选属性的技能；不足时用其它系补足（保证总能三选一）
  const main = color ? SKILLS.filter((sk) => sk.attr === color && usable(sk)) : [];
  const rest = SKILLS.filter((sk) => (!color || sk.attr !== color) && usable(sk));
  let out = draw(main, n);
  if (out.length < n) out = out.concat(draw(rest.filter((sk) => out.indexOf(sk) < 0), n - out.length));
  if (p.hp < p.maxHp * 0.55 && out.length && Math.random() < 0.55) out[out.length - 1] = HEAL_CARD;
  return out;
}

    '<div class="row" style="flex-direction:column">' +
    '<button class="btn primary" id="pResume">▶ 继续</button>' +
    '<button class="btn ghost" id="pRestart">🔄 重开本关</button>' +
    '<button class="btn ghost" id="pQuit">🏠 放弃并返回</button>' +
    "</div>"
  );
  $("pResume").onclick = resumeGame;
  $("pRestart").onclick = () => startRun(G.chapter, G.level, G.endless, { twoP: G.twoP, challenge: G.challenge });
  $("pQuit").onclick = () => { G.state = "menu"; hideOverlay(); showMenu(); };
}
function showVictory(bonus) {
  el.hud.classList.add("hidden");
  const nextLv = G.level + 1;
  const hasNext = nextLv <= CHAPTER_MAX_LEVEL;
  showOverlay(
    '<h1 class="title" style="font-size:28px">通 关 ！</h1>' +
    '<div class="subtitle">' + chapterName(G.chapter) + " " + G.chapter + "-" + G.level + (G.twoP ? " · 双人同屏" : "") + "</div>" +
    '<div class="panel" style="text-align:center"><div style="font-size:13px;line-height:2.1;color:#c9d7f0">' +
    "通关奖励　<b style='color:#ffd479'>+" + bonus + " 🪙</b><br>" +
    "本局金币合计　<b style='color:#ffd479'>" + G.runCoins + " 🪙</b><br>" +
    "击杀敌人　<b>" + RUN.kills + "</b>　·　技能　<b>" + skillCountText() + "</b><br>" +
    "用时　<b>" + Math.floor(G.runTime) + " 秒</b>" +
    "</div></div>" +
    (carrySkillCount()
      ? '<div class="panel" style="border-color:#57e08a88;text-align:center"><div style="font-size:12px;line-height:1.8;color:#c9d7f0">' +
        "🔗 <b style='color:#57e08a'>技能与等级会继承到下一关</b><br>" +
        "当前 " + carrySkillCount() + " 种技能 · Lv." + (players[0] ? players[0].level : 1) +
        "（死亡或返回主菜单才会重新开始）</div></div>"
      : '<div class="panel" style="border-color:#57e08a66;text-align:center"><div style="font-size:12px;line-height:1.8;color:#c9d7f0">' +
        "🔗 <b style='color:#57e08a'>技能与等级会继承到下一关</b><br>" +
        "<span style='color:#93a4c4'>本关没有获得技能，下一关会继续积累</span></div></div>") +
    '<div class="row" style="flex-direction:column">' +
    (hasNext ? '<button class="btn primary" id="vNext">▶ 下一关 ' + G.chapter + "-" + nextLv + "（继承技能）</button>" : '<button class="btn primary" id="vNextCh">▶ 进入下一章（继承技能）</button>') +
    '<div class="row">' +
    '<button class="btn ghost" id="vShop">⚒ 强化 &amp; 武器</button>' +
    '<button class="btn ghost" id="vMenu">🏠 主菜单</button>' +
    "</div></div>"
  );
  if (hasNext) $("vNext").onclick = () => startRun(G.chapter, nextLv, false, { twoP: G.twoP, keep: true });
  else $("vNextCh").onclick = () => startRun(Math.min(G.chapter + 1, CHAPTERS.length), 1, false, { twoP: G.twoP, keep: true });
  $("vShop").onclick = showShop;
  $("vMenu").onclick = showMenu;
}
function showDefeat(endless) {
  el.hud.classList.add("hidden");
  const ch = G.challenge;
  let challengeBlock = "";
  if (ch) {
    const my = G.endlessWave;
    const win = my > (ch.score | 0);
    const tie = my === (ch.score | 0);
    recordChallenge({ seed: ch.seed, name: ch.name, score: ch.score, myScore: my });
    const seed = ch.seed;
    const url = challengeUrl(seed, save.playerName || "", my);
    challengeBlock =
      '<div class="panel" style="border-color:' + (win ? "#57e08a99" : "#ff8a8a99") + ';text-align:center">' +
      '<div style="font-size:15px;font-weight:900;color:' + (win ? "#57e08a" : tie ? "#ffd479" : "#ff8a8a") + '">' +
      (win ? "🏆 你赢了！" : tie ? "🤝 平局！" : "😵 你输了") + "</div>" +
      '<div style="font-size:12px;color:#c9d7f0;line-height:1.9;margin-top:4px">' +
      "我 <b style='color:#ffd479;font-size:16px'>" + my + "</b> 波　vs　" + esc(ch.name || "好友") + " <b>" + (ch.score | 0) + "</b> 波<br>" +
      (win ? "把新纪录甩回去，让他再挑战一次 👇" : "再打一次，把场子找回来 👇") +
      "</div>" +
      '<div class="row"><button class="btn primary" id="dCopy">📤 回敬挑战链接</button>' +
      '<button class="btn ghost" id="dShare">📲 分享</button></div></div>';
  }
  showOverlay(
    '<h1 class="title" style="font-size:28px;background:linear-gradient(180deg,#ffc9c9,#ff4d63 60%,#8a1024);-webkit-background-clip:text;background-clip:text;color:transparent">你 倒 下 了</h1>' +
    '<div class="subtitle">' + (endless ? (ch ? "好友挑战 · " : "无尽模式 · ") + "第 " + G.endlessWave + " 波" : chapterName(G.chapter) + " " + G.chapter + "-" + G.level) +
    (G.twoP ? " · 双人同屏" : "") + "</div>" +
    challengeBlock +
    '<div class="panel" style="text-align:center"><div style="font-size:13px;line-height:2.1;color:#c9d7f0">' +
    "本局金币已保留　<b style='color:#ffd479'>+" + G.runCoins + " 🪙</b><br>" +
    "击杀敌人　<b>" + RUN.kills + "</b>　·　技能　<b>" + skillCountText() + "</b><br>" +
    "用时　<b>" + Math.floor(G.runTime) + " 秒</b>" +
    "</div></div>" +
    '<div class="row" style="flex-direction:column">' +
    '<button class="btn primary" id="dRetry">🔄 再来一次</button>' +
    '<div class="row">' +
    '<button class="btn ghost" id="dShop">⚒ 强化变强</button>' +
    '<button class="btn ghost" id="dMenu">🏠 主菜单</button>' +
    "</div></div>" +
    '<div class="tip">💡 提示：先去商店把金币花掉，攻击/生命/复活都会永久提升</div>'
  );
  if (ch) {
    const url = challengeUrl(ch.seed, save.playerName || "", G.endlessWave);
    $("dCopy").onclick = () => copyText(url, $("dCopy"));
    $("dShare").onclick = () => {
      if (navigator.share) navigator.share({ title: "音帝庙大冒险 · 回敬挑战", text: "我打到第 " + G.endlessWave + " 波，该你了！", url: url }).catch(() => { });
      else copyText(url, $("dCopy"));
    };
  }
  $("dRetry").onclick = () => startRun(G.chapter, G.level, G.endless, { twoP: G.twoP, challenge: ch });
  $("dShop").onclick = showShop;
  $("dMenu").onclick = showMenu;
}

/* ======================= 启动 ======================= */
requestAnimationFrame(frame);
resize();
showMenu();

</script>
</body>
</html>
