<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>弓箭传说 · 复刻版</title>
<style>
:root{
  --gold:#ffd479; --gold2:#ffb02e; --ink:#0a0e18; --ink2:#121a2c; --line:#2a3854;
  --txt:#e9f0ff; --dim:#93a4c4; --red:#ff5c72; --green:#57e08a; --blue:#5cc8ff;
  --safeT: env(safe-area-inset-top, 0px);
  --safeB: env(safe-area-inset-bottom, 0px);
  --safeL: env(safe-area-inset-left, 0px);
  --safeR: env(safe-area-inset-right, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#04060c;color:var(--txt);
  font-family:"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden}
canvas#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:1}
.hidden{display:none !important}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;z-index:5;pointer-events:none}
.hud-top{position:absolute;top:calc(6px + var(--safeT));left:calc(8px + var(--safeL));right:calc(8px + var(--safeR));
  display:flex;align-items:flex-start;gap:8px}
.hud-left{flex:1;min-width:0;max-width:44%}
.bar{position:relative;height:16px;border-radius:9px;background:#0d1424cc;border:1.5px solid #33507e;
  overflow:hidden;box-shadow:0 2px 8px #0008, inset 0 0 10px #0006}
.bar.xp{height:9px;margin-top:4px;border-color:#3d6a4e}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:8px;transition:width .12s linear}
.bar.hp .fill{background:linear-gradient(180deg,#ff8a9a,#e0243f);box-shadow:0 0 12px #ff335588}
.bar .shieldfill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(180deg,#9fe6ff,#2b90d8);opacity:.9}
.bar.xp .fill{background:linear-gradient(180deg,#8dffb0,#22a85a);box-shadow:0 0 10px #33ff8844}
.bar-txt{position:absolute;inset:0;font-size:11px;line-height:16px;text-align:center;font-weight:700;
  text-shadow:0 1px 2px #000c;letter-spacing:.5px}
.lvtag{display:inline-block;margin-top:4px;font-size:10px;font-weight:800;color:#08101c;background:linear-gradient(180deg,var(--gold),var(--gold2));
  border-radius:6px;padding:1px 7px;box-shadow:0 2px 6px #0008}
.hud-mid{flex:0 0 auto;text-align:center;padding-top:2px}
.stage{font-size:13px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 6px #000, 0 0 14px #ffcf7a44;color:#ffe9bd}
.sub{font-size:10px;color:var(--dim);margin-top:2px;text-shadow:0 1px 3px #000}
.hud-right{flex:0 0 auto;display:flex;align-items:center;gap:6px;pointer-events:auto}
.coins{font-size:12px;font-weight:800;background:#0d1424cc;border:1.5px solid #4a5a3a;border-radius:9px;
  padding:3px 8px;color:var(--gold);text-shadow:0 1px 3px #000}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:#0d1424dd;
  color:var(--txt);font-size:15px;display:grid;place-items:center;cursor:pointer;pointer-events:auto}
.iconbtn:active{transform:scale(.94)}
#skillBar{position:absolute;left:calc(8px + var(--safeL));bottom:calc(6px + var(--safeB));display:flex;flex-wrap:wrap;gap:4px;max-width:60%}
.skchip{width:30px;height:30px;border-radius:9px;background:#0d1424e0;border:1.5px solid #3a4f78;display:grid;place-items:center;
  font-size:15px;position:relative;box-shadow:0 2px 6px #0007}
.skchip b{position:absolute;right:-2px;bottom:-3px;font-size:9px;background:var(--gold2);color:#1a1206;border-radius:6px;
  padding:0 4px;font-weight:900;border:1px solid #00000055}

/* 摇杆 */
#stick{position:absolute;z-index:6;width:150px;height:150px;margin-left:-75px;margin-top:-75px;pointer-events:none}
.stick-base{position:absolute;inset:0;border-radius:50%;border:2px solid #ffffff2e;background:radial-gradient(circle,#ffffff14,#ffffff05 70%,transparent)}
.stick-knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#ffffffcc,#7fa6dd77);border:2px solid #ffffff55;box-shadow:0 0 18px #7fd0ff55}
#btnDash{position:absolute;right:calc(16px + var(--safeR));bottom:calc(24px + var(--safeB));width:74px;height:74px;border-radius:50%;
  border:2px solid #6fd7ff88;background:radial-gradient(circle at 40% 35%,#2c6f9ecc,#0d2233dd);color:#dff3ff;font-size:26px;
  pointer-events:auto;box-shadow:0 6px 18px #0009, 0 0 22px #46c6ff44;display:grid;place-items:center;transition:transform .08s}
#btnDash:active{transform:scale(.92)}
#btnDash.cd{filter:grayscale(.8) brightness(.6)}

/* ---------- 覆盖界面 ---------- */
#overlay{position:absolute;inset:0;z-index:20;display:none;overflow:hidden}
#overlay.show{display:block}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(10px + var(--safeT)) calc(12px + var(--safeR)) calc(10px + var(--safeB)) calc(12px + var(--safeL));
  background:radial-gradient(120% 90% at 50% 0%,#16233ccc,#05070e 70%),#05070e;overflow-y:auto;overscroll-behavior:contain}
.screen.dim{background:#03060cd9;backdrop-filter:blur(3px)}
h1.title{font-size:clamp(26px,7vw,46px);font-weight:900;letter-spacing:4px;line-height:1.1;
  background:linear-gradient(180deg,#fff3d0,#ffb02e 60%,#b96a12);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 14px #ff9a2e55)}
.subtitle{color:#c9d7f0;font-size:12px;letter-spacing:3px;margin:6px 0 18px;opacity:.85}
.btn{min-width:190px;padding:12px 22px;margin:6px;border-radius:14px;border:1.5px solid #6b7fa8;cursor:pointer;
  background:linear-gradient(180deg,#28395c,#161f34);color:#eaf1ff;
  font-size:15px;font-weight:800;letter-spacing:1px;box-shadow:0 4px 14px #0008;transition:transform .08s}
.btn:active{transform:translateY(2px) scale(.985)}
.btn.primary{border-color:#ffd479aa;background:linear-gradient(180deg,#ffca5c,#e08a12);color:#20160a;
  box-shadow:0 6px 20px #ffa62e55, inset 0 1px 0 #fff8}
.btn.ghost{background:#131c2f;border-color:#3a4f78;color:#c9d7f0}
.btn.small{min-width:auto;padding:8px 14px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.45;filter:grayscale(.6)}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px}
.panel{width:min(680px,96vw);background:linear-gradient(180deg,#101a2ccc,#0a1120ee);border:1.5px solid #2c3b5c;
  border-radius:16px;padding:12px;box-shadow:0 10px 40px #000a;margin:8px 0}
.panel h2{font-size:14px;color:var(--gold);letter-spacing:2px;margin-bottom:8px;text-align:center;font-weight:900}
.grid-lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:7px;width:100%}
.lvcell{aspect-ratio:1/1;border-radius:12px;border:1.5px solid #3a4f78;background:linear-gradient(180deg,#1b2740,#111a2c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:14px;cursor:pointer}
.lvcell small{font-size:9px;color:var(--dim);font-weight:600}
.lvcell.boss{border-color:#c46bff88;box-shadow:0 0 14px #a855f755 inset}
.lvcell.locked{opacity:.42;cursor:not-allowed}
.lvcell.done{border-color:#4ee39a88;background:linear-gradient(180deg,#123326,#0d2119)}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:11px;border:1.5px solid #3a4f78;background:#131c2f;font-size:12px;font-weight:800;cursor:pointer}
.tab.on{background:linear-gradient(180deg,#ffca5c,#e08a12);color:#20160a;border-color:#ffd479aa}
.cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}
.card{width:min(210px,44vw);min-height:170px;border-radius:16px;padding:14px 10px;cursor:pointer;
  background:linear-gradient(180deg,#1a2540,#0d1424);border:2px solid #3a4f78;display:flex;flex-direction:column;align-items:center;
  gap:6px;text-align:center;box-shadow:0 8px 26px #0009;transition:transform .1s}
.card:active{transform:scale(.97)}
.card .ic{font-size:34px;filter:drop-shadow(0 3px 8px #000a)}
.card .nm{font-size:15px;font-weight:900;color:#fff}
.card .ds{font-size:11.5px;color:#b9c8e4;line-height:1.5}
.card .rr{font-size:10px;font-weight:900;padding:2px 8px;border-radius:7px;margin-top:auto;letter-spacing:1px}
.r1{border-color:#5b7fb0}.r1 .rr{background:#37507a;color:#dbe8ff}
.r2{border-color:#7d6bff}.r2 .rr{background:#4b3fbb;color:#e6e0ff}
.r3{border-color:#ffb84d;box-shadow:0 0 22px #ffab2e44}.r3 .rr{background:#a86a10;color:#fff2d0}
.stack{position:absolute}
.list{display:flex;flex-direction:column;gap:7px;width:100%;max-height:46vh;overflow-y:auto;padding-right:2px}
.item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:13px;background:#152036;border:1.5px solid #34486e}
.item .ic{font-size:24px;width:32px;text-align:center}
.item .tx{flex:1;min-width:0}
.item .nm{font-size:13.5px;font-weight:800}
.item .ds{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.45}
.pill{font-size:11px;font-weight:800;color:#0e141f;background:linear-gradient(180deg,var(--gold),var(--gold2));border-radius:9px;padding:5px 10px;white-space:nowrap}
.pill.off{background:#26324a;color:#8ea0c0}
.tip{font-size:11px;color:var(--dim);line-height:1.7;text-align:center;max-width:600px}
.kbd{display:inline-block;background:#1d2942;border:1px solid #3d527a;border-radius:5px;padding:0 5px;font-size:11px;margin:0 1px}
#toast{position:absolute;left:50%;top:calc(18% + var(--safeT));transform:translateX(-50%);z-index:30;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:6px}
.tmsg{background:#0d1424e6;border:1.5px solid #ffd47966;color:#ffe9bd;border-radius:11px;padding:7px 14px;font-size:13px;
  font-weight:800;box-shadow:0 6px 20px #000a;animation:tin .3s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wide{width:100%;display:flex;justify-content:center}
.scroll{width:100%;overflow-y:auto}
@media (max-height:430px){
  h1.title{font-size:24px}.subtitle{margin-bottom:8px}
  .btn{padding:9px 16px;font-size:13.5px;min-width:150px;margin:4px}
  .card{min-height:130px}.card .ic{font-size:26px}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-left">
        <div class="bar hp"><div class="fill" id="hpFill"></div><div class="shieldfill" id="shFill"></div>
          <div class="bar-txt" id="hpTxt">100/100</div></div>
        <div class="bar xp"><div class="fill" id="xpFill" style="width:0%"></div></div>
        <div class="lvtag" id="lvTag">Lv.1</div>
      </div>
      <div class="hud-mid">
        <div class="stage" id="stageTxt">森林 1-1</div>
        <div class="sub" id="roomTxt">房间 1/4</div>
      </div>
      <div class="hud-right">
        <div class="coins" id="coinTxt">🪙 0</div>
        <button class="iconbtn" id="btnPause">⏸</button>
      </div>
    </div>
    <div id="skillBar"></div>
    <button id="btnDash" class="hidden">💨</button>
    <div id="stick" class="hidden"><div class="stick-base"></div><div class="stick-knob" id="stickKnob"></div></div>
  </div>

  <div id="overlay"></div>
  <div id="toast"></div>
</div>

<script>
"use strict";
/* =========================================================================
   弓箭传说 · 复刻版（单文件 H5）
   ========================================================================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (a) => a[(Math.random() * a.length) | 0];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const dist2 = (a, b) => (a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y);
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = (n) => (n >= 10000 ? (n / 1000).toFixed(1) + "k" : Math.round(n).toString());

/* ======================= 存档 ======================= */
const SAVE_KEY = "archery_legend_v1";
function defaultSave() {
  return {
    coins: 0,
    weapon: "bow",
    weapons: { bow: 1 },
    perm: { atk: 0, hp: 0, speed: 0, aspd: 0, luck: 0, revive: 0, crit: 0 },
    progress: {},          // {"1-3":true}
    unlocked: { 1: 1 },    // 每章解锁到第几关
    chapter: 1, level: 1,
    sound: true, best: 0, endlessBest: 0, endlessUnlocked: false
  };
}
let save = defaultSave();
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) {
    const o = JSON.parse(raw);
    save = Object.assign(defaultSave(), o);
    save.perm = Object.assign(defaultSave().perm, o.perm || {});
    save.weapons = Object.assign({ bow: 1 }, o.weapons || {});
    save.unlocked = Object.assign({ 1: 1 }, o.unlocked || {});
    save.progress = o.progress || {};
  }
} catch (e) { console.warn("存档读取失败", e); }
let saveTimer = 0, lastSaveAt = 0;
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); lastSaveAt = Date.now(); }
  catch (e) { console.warn("存档写入失败", e); }
}
/* 高频事件（拾取金币）走节流，重要事件立即落盘，切后台/关页也会强制写入 */
function persist(force) {
  const now = Date.now();
  clearTimeout(saveTimer);
  if (force || now - lastSaveAt > 400) { writeSave(); return; }
  saveTimer = setTimeout(writeSave, 400);
}
window.addEventListener("pagehide", () => writeSave());
window.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") writeSave(); });

/* ======================= 音效（WebAudio 合成） ======================= */
const Sfx = {
  ctx: null, master: null,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.22;
      this.master.connect(this.ctx.destination);
    } catch (e) { }
  },
  resume() { if (this.ctx && this.ctx.state === "suspended") this.ctx.resume().catch(() => { }); },
  tone(freq, dur, type, vol, slide) {
    if (!save.sound) return;
    this.init(); if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, hp) {
    if (!save.sound) return;
    this.init(); if (!this.ctx) return;
    const t = this.ctx.currentTime, n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const g = this.ctx.createGain(); g.gain.value = vol || 0.3;
    const f = this.ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp || 400;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  shoot() { this.tone(rand(620, 720), 0.06, "square", 0.10, 380); },
  hit() { this.tone(rand(280, 340), 0.05, "triangle", 0.14, 160); },
  crit() { this.tone(880, 0.09, "sawtooth", 0.16, 300); },
  hurt() { this.tone(180, 0.22, "sawtooth", 0.24, 70); },
  coin() { this.tone(1180, 0.07, "triangle", 0.13, 1560); },
  levelup() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 0.16, "triangle", 0.18), i * 70)); },
  die() { this.noise(0.4, 0.35, 200); this.tone(300, 0.5, "sawtooth", 0.2, 60); },
  clear() { [659, 784, 988, 1318].forEach((f, i) => setTimeout(() => this.tone(f, 0.2, "square", 0.14), i * 90)); },
  boss() { this.tone(90, 0.9, "sawtooth", 0.3, 55); },
  dash() { this.noise(0.16, 0.22, 900); },
  pick() { this.tone(760, 0.08, "triangle", 0.16, 1200); }
};

/* ======================= DOM ======================= */
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx2d = cv.getContext("2d", { alpha: false });
const overlay = $("overlay"), toastBox = $("toast");
const el = {
  hud: $("hud"), hpFill: $("hpFill"), shFill: $("shFill"), hpTxt: $("hpTxt"),
  xpFill: $("xpFill"), lvTag: $("lvTag"), stageTxt: $("stageTxt"), roomTxt: $("roomTxt"),
  coinTxt: $("coinTxt"), skillBar: $("skillBar"), stick: $("stick"), stickKnob: $("stickKnob"),
  btnDash: $("btnDash"), btnPause: $("btnPause")
};
function toast(msg, ms) {
  const d = document.createElement("div");
  d.className = "tmsg"; d.textContent = msg; toastBox.appendChild(d);
  setTimeout(() => { d.style.transition = "opacity .3s"; d.style.opacity = "0"; setTimeout(() => d.remove(), 320); }, ms || 1200);
}

/* ======================= 全局游戏状态 ======================= */
const G = {
  state: "menu",      // menu | playing | paused | levelup | dead | clear
  t: 0, dt: 0, time: 0,
  shake: 0, hitStop: 0,
  room: 0, rooms: [], chapter: 1, level: 1, endless: false, endlessWave: 0,
  enemiesLeft: 0, roomClear: false, roomClearTimer: 0,
  runCoins: 0, runKills: 0, runTime: 0, revivesLeft: 0, weapon: "bow",
  pendingLevelUps: 0
};
let player = null, enemies = [], arrows = [], ebullets = [], pickups = [], parts = [], floats = [], effects = [];
const MAX_ENEMIES = 30;

/* ======================= 画布 / 自适应（折叠屏展开/折叠都适配） ======================= */
const V = { w: 400, h: 700, dpr: 1, scale: 1, safeTop: 0, safeBot: 0 };
function resize() {
  const vv = window.visualViewport;
  const w = Math.max(280, Math.round(vv ? vv.width : window.innerWidth));
  const h = Math.max(320, Math.round(vv ? vv.height : window.innerHeight));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  V.w = w; V.h = h; V.dpr = dpr;
  V.scale = clamp(Math.min(w, h) / 430, 0.7, 1.25);   // 展开屏不要放大过头，避免房间显得拥挤
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = w + "px"; cv.style.height = h + "px";
  ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  document.documentElement.style.setProperty("--vh", h * 0.01 + "px");
  const app = $("app");
  app.style.width = w + "px"; app.style.height = h + "px";
  if (typeof onResizeGame === "function") onResizeGame();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", resize);
  window.visualViewport.addEventListener("scroll", resize);
}
resize();

/* ======================= 输入：虚拟摇杆 + 键盘 ======================= */
const Input = {
  active: false, id: -1, ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0, mag: 0,
  keys: {},
  maxR() { return clamp(Math.min(V.w, V.h) * 0.16, 42, 82); },
  start(id, x, y) {
    this.active = true; this.id = id; this.ox = x; this.oy = y; this.x = x; this.y = y;
    el.stick.classList.remove("hidden");
    el.stick.style.left = x + "px"; el.stick.style.top = y + "px";
    const s = this.maxR() * 2 / 150;
    el.stick.style.transform = "scale(" + s.toFixed(3) + ")";
    this.update(x, y);
  },
  update(x, y) {
    if (!this.active) return;
    const R = this.maxR();

    if (m > R) { this.ox += (dx / m) * (m - R) * 0.55; this.oy += (dy / m) * (m - R) * 0.55; }

    dx = x - this.ox; dy = y - this.oy;
    const m2 = Math.hypot(dx, dy) || 1;
    const k = Math.min(m2, R) / R;
    this.x = x; this.y = y;
    this.mag = k;
    if (m2 > 4) { this.dx = (dx / m2) * k; this.dy = (dy / m2) * k; } else { this.dx = 0; this.dy = 0; this.mag = 0; }

  },
  end(id) {
    if (id !== undefined && id !== this.id) return;

function tierOf(ch, lv, ew) { return (ch - 1) * 10 + lv + (ew || 0); }
/* 敌人成长：技能每局重置，因此血量成长必须平缓，主要靠永久强化与装备拉开差距 */
function hpScale(tier) { return Math.pow(1.05, Math.max(0, tier - 1)); }
function dmgScale(tier) { return Math.pow(1.028, Math.max(0, tier - 1)); }

function buildLevel(ch, lv) {
  const tier = tierOf(ch, lv, 0);
  const bossLv = BOSS_LEVELS.indexOf(lv) >= 0;
  const roomCount = 3 + (lv >= 6 ? 1 : 0);
  const rooms = [];
  for (let i = 0; i < roomCount; i++) {
    const last = i === roomCount - 1;
    if (last && bossLv) {
      const b = BOSSES[(ch - 1) % BOSSES.length];
      rooms.push({ boss: b.id, name: b.name, kind: "boss" });
      continue;
    }
    const waves = [];
    const waveN = 1 + (lv >= 5 ? 1 : 0);
    for (let w = 0; w < waveN; w++) {
      const cnt = 3 + Math.floor(lv * 0.4) + w;
      const list = [];
      const pool = CHAPTERS[(ch - 1) % CHAPTERS.length].pool;
      let left = Math.min(cnt, 9);
      while (left > 0) {
        const t = pick(pool);
        const k = Math.min(left, randInt(1, 3));
        list.push({ t: t, n: k });
        left -= k;
      }
      waves.push(list);
    }
    const elite = (!last && lv >= 3 && i === Math.floor(roomCount / 2) - 0 && Math.random() < 0.28 + lv * 0.02);
    rooms.push({ waves: waves, kind: elite ? "elite" : "normal", tier: tier });
  }
  return rooms;
}
function buildEndlessRooms(wave) {
  const ch = 1 + Math.floor(wave / 8) % 3;
  const lv = 1 + (wave % 8);
  const rooms = buildLevel(ch, lv);
  const last = rooms[rooms.length - 1];
  if (last.boss && wave % 3 !== 2) { // 无尽模式每 3 波一次 Boss
    rooms[rooms.length - 1] = { waves: [[{ t: "shield", n: 3 }, { t: "mage", n: 2 }]], kind: "elite", tier: tierOf(ch, lv, wave) };
  }

}

    if (e.burn > 0) {
      e.burn -= dt; e.burnT -= dt;
      if (e.burnT <= 0) { e.burnT = 0.5; hurtEnemySilent(e, e.burnSrc * 0.5); }
    }
    if (e.slow > 0) e.slow -= dt;
    let spd = e.speed * (e.slow > 0 ? 0.55 : 1) * dt;
    if (st.slowmo > 0 && dist(e, player) < 150 * V.scale) spd *= 1 - 0.28 * st.slowmo;
    e.anim += dt;
    const ang = Math.atan2(player.y - e.y, player.x - e.x);
    const dd = dist(e, player);

    switch (e.ai) {
      case "chase":
      case "splitter":
      case "healer": {
        e.x += Math.cos(ang) * (e.speed === 0 ? 0 : spd);
        e.y += Math.sin(ang) * (e.speed === 0 ? 0 : spd);
        if (e.ai === "healer") {
          e.atkT -= dt;
          if (e.atkT <= 0) {
            e.atkT = 3.4;
            // 只治疗范围内血量比例最低的一个友军：避免群体百分比回血把玩家伤害完全抵消
            let worst = null, wp = 1;
            for (const o of enemies) {
              if (o === e || o.dead || o.hp >= o.maxHp) continue;
              if (dist(o, e) > 190 * V.scale) continue;
              const pct = o.hp / o.maxHp;
              if (pct < wp) { wp = pct; worst = o; }
            }
            if (worst) {
              worst.hp = Math.min(worst.maxHp, worst.hp + worst.maxHp * 0.16);
              healFx(worst);
              addFloat(worst.x, worst.y - worst.r - 6, "治疗", "#7dffa8", 13);
              ring(e.x, e.y, 60 * V.scale, "#f2d06b", 0.35);
            }
          }
        }
        break;
      }
      case "ghost": {
        e.x += Math.cos(ang) * spd * 0.85;
        e.y += Math.sin(ang) * spd * 0.85;
        e.wob += dt * 6;
        break;
      }
      case "erratic": {
        e.wob += dt * 5;
        const a2 = ang + Math.sin(e.wob) * 0.7;
        e.x += Math.cos(a2) * spd * 0.95;
        e.y += Math.sin(a2) * spd * 0.95;
        break;
      }
      case "shooter": {
        const want = ENEMIES[e.type].range * V.scale * 0.8;
        const dir = dd > want ? 1 : -1;
        e.x += Math.cos(ang) * spd * dir * 0.85;
        e.y += Math.sin(ang) * spd * dir * 0.85;
        e.x += Math.cos(ang + Math.PI / 2) * spd * 0.25 * Math.sin(e.anim * 1.4);
        e.atkT -= dt;
        if (e.atkT <= 0 && dd < want * 1.5) { e.atkT = ENEMIES[e.type].atkCd; enemyShoot(e, ang, 1); }
        break;
      }
      case "turret": {
        e.atkT -= dt;
        if (e.atkT <= 0) { e.atkT = ENEMIES[e.type].atkCd; enemyShoot(e, ang, 3, 0.22); }
        break;
      }
      case "spinner": {
        const want = 220 * V.scale;
        const dir = dd > want ? 1 : -0.6;
        e.x += Math.cos(ang) * spd * 0.6 * dir;
        e.y += Math.sin(ang) * spd * 0.6 * dir;
        e.wob += dt * 3;
        e.x += Math.cos(e.wob) * spd * 0.29;
        e.y += Math.sin(e.wob) * spd * 0.29;
        e.atkT -= dt;
        if (e.atkT <= 0) { e.atkT = ENEMIES[e.type].atkCd; enemyShoot(e, e.wob, 6, TAU / 6, true); }
        break;
      }
      case "bomber": {
        if (e.chargeState === 0) {
          e.x += Math.cos(ang) * spd * 1.15;
          e.y += Math.sin(ang) * spd * 1.15;
          if (dd < e.r + player.r + 46 * V.scale) { e.chargeState = 1; e.chargeT = 0.55; }
        } else {
          // 引信：给自己 0.55 秒逃跑窗口，而不是贴脸瞬间爆炸
          e.chargeT -= dt;
          e.chargeState = e.chargeT > 0 ? 1 : 2;
          if (e.chargeState === 2) {
            explodeEnemy(e, 80 * V.scale, e.dmg);
            e.dead = true; killEnemy(e, {}); enemies.splice(i, 1); continue;
          }
        }
        break;
      }
      case "charger": {
        if (e.chargeState === 0) {
          e.x += Math.cos(ang) * spd * 0.55;
          e.y += Math.sin(ang) * spd * 0.55;
          e.chargeT -= dt;
          if (e.chargeT <= 0 && dd < 420 * V.scale) { e.chargeState = 1; e.chargeT = 0.55; e.chargeAng = ang; }
        } else if (e.chargeState === 1) {
          e.chargeT -= dt;
          e.chargeAng = lerp(e.chargeAng, ang, 0.06);
          if (e.chargeT <= 0) { e.chargeState = 2; e.chargeT = 0.5; }
        } else {
          e.chargeT -= dt;
          e.x += Math.cos(e.chargeAng) * e.speed * 4.2 * dt;
          e.y += Math.sin(e.chargeAng) * e.speed * 4.2 * dt;
          if (e.chargeT <= 0) { e.chargeState = 0; e.chargeT = rand(1.0, 1.8); }
        }
        break;
      }
      case "boss": {
        updateBoss(e, dt, ang, dd, spd);
        break;
      }
    }
    // 边界（Boss 允许贴边，其他夹紧一点）
    const b = BOUND();
    e.x = clamp(e.x, b.l + e.r * 0.5, b.r - e.r * 0.5);
    e.y = clamp(e.y, b.t + e.r * 0.5, b.b - e.r * 0.5);
    // 接触伤害
    if (dd < e.r + player.r) {
      if (e.ai === "boss") {
        if (!e.bossHitT || G.time - e.bossHitT > 1.0) { e.bossHitT = G.time; hurtPlayer(e.dmg * 0.6, e); }
      } else if (e.ai !== "bomber") {
        if (!e.touchT || G.time - e.touchT > 1.0) { e.touchT = G.time; hurtPlayer(e.dmg * 0.65, e); }
      }
    }
  }
}
function healFx(e) { spawnParticles(e.x, e.y, "#7dffa8", 5, 100, 0.4, 3, true); }
function hurtEnemySilent(e, d) {
  if (e.dead) return;
  e.hp -= d;
  if (e.hp <= 0) killEnemy(e, {});
}
function explodeEnemy(e, r, dmg) {
  ring(e.x, e.y, r, "#ff8a3d", 0.4);
  spawnParticles(e.x, e.y, "#ff8a3d", 14, 260, 0.5, 5, true);
  Sfx.noise(0.3, 0.3, 200);
  G.shake = Math.max(G.shake, 6);
  if (dist(e, player) < r) hurtPlayer(dmg, e);
}
function enemyShoot(e, ang, n, spread, radial) {
  n = n || 1; spread = spread === undefined ? 0.08 : spread;
  for (let i = 0; i < n; i++) {
    const a = radial ? ang + i * spread : ang + (i - (n - 1) / 2) * spread;
    const sp = 320 * V.scale;
    ebullets.push({
      x: e.x + Math.cos(a) * (e.r + 4), y: e.y + Math.sin(a) * (e.r + 4),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, dmg: e.dmg * 0.7, r: 6 * V.scale,
      color: e.boss ? "#ff9db5" : "#ffd479", life: 4, homing: 0
    });
  }
  Sfx.tone(e.boss ? 300 : 420, 0.1, "sawtooth", 0.1, 200);
}
/* ---- Boss 行为 ---- */
function updateBoss(e, dt, ang, dd, spd) {
  const hpPct = e.hp / e.maxHp;
  e.phase = hpPct > 0.6 ? 1 : hpPct > 0.3 ? 2 : 3;
  const rage = 1 + (e.phase - 1) * 0.35;
  // 移动：保持中距离
  const want = 200 * V.scale;
  const dir = dd > want ? 1 : -1;
  e.x += Math.cos(ang) * spd * 0.8 * dir;
  e.y += Math.sin(ang) * spd * 0.8 * dir;
  if (e.chargeState === 2) {
    e.chargeT -= dt;
    e.x += Math.cos(e.chargeAng) * e.speed * 5.2 * dt;
    e.y += Math.sin(e.chargeAng) * e.speed * 5.2 * dt;
    if (e.chargeT <= 0) e.chargeState = 0;
    return;
  }
  e.atkT -= dt * rage;
  if (e.atkT <= 0) {
    e.atkT = (2.1 - e.phase * 0.18) * rand(0.9, 1.15);
    const pat = e.pat[e.patIdx % e.pat.length]; e.patIdx++;
    switch (pat) {
      case "radial": {
        const n = 8 + e.phase * 4;
        enemyShoot(e, ang, n, TAU / n, true);
        ring(e.x, e.y, 60 * V.scale, e.color, 0.3);
        break;
      }
      case "aimed": {
        for (let k = 0; k < 2 + e.phase; k++) setTimeout(() => { if (!e.dead && G.state === "playing") enemyShoot(e, Math.atan2(player.y - e.y, player.x - e.x), 5, 0.18); }, k * 190);
        break;
      }
      case "sweep": {
        const baseA = ang - 0.6 * e.phase;
        for (let k = 0; k < 6 + e.phase * 2; k++) setTimeout(() => { if (!e.dead && G.state === "playing") enemyShoot(e, baseA + k * 0.24, 1); }, k * 80);
        break;
      }
      case "summon": {
        const pool = CHAPTERS[(G.chapter - 1) % CHAPTERS.length].pool;
        const n = 2 + e.phase;
        for (let k = 0; k < n; k++) {
          if (enemies.length >= MAX_ENEMIES) break;
          spawnEnemy(pick(pool), { x: e.x + rand(-90, 90), y: e.y + rand(-60, 60), tier: e.tier, hpMul: 0.75 });
        }
        ring(e.x, e.y, 100 * V.scale, "#ffffff", 0.4);
        break;
      }
      case "charge": {
        e.chargeState = 1; e.chargeT = 0.5; e.chargeAng = ang;
        setTimeout(() => { if (!e.dead && G.state === "playing") { e.chargeState = 2; e.chargeT = 0.45; Sfx.dash(); } }, 480);
        break;
      }
    }
  }
}

/* ======================= 敌方子弹 ======================= */
function updateEBullets(dt) {
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    if (b.homing > 0) {
      const want = Math.atan2(player.y - b.y, player.x - b.x);
      const cur = Math.atan2(b.vy, b.vx);
      let diff = ((want - cur + Math.PI * 3) % TAU) - Math.PI;
      const na = cur + clamp(diff, -1.8 * dt, 1.8 * dt);
      const sp = Math.hypot(b.vx, b.vy);
      b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
    }
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    const bd = BOUND();
    if (b.life <= 0 || b.x < bd.l - 40 || b.x > bd.r + 40 || b.y < bd.t - 40 || b.y > bd.b + 40) { ebullets.splice(i, 1); continue; }
    if (dist(b, player) < player.r + b.r) {
      hurtPlayer(b.dmg, null);
      spawnParticles(b.x, b.y, b.color, 5, 120, 0.3, 3);
      ebullets.splice(i, 1);
    }
  }
}

/* ======================= 掉落 / 粒子 / 特效 ======================= */
function updatePickups(dt) {
  const R = pickupRange() * V.scale;
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.t += dt; p.life -= dt;
    const d = dist(p, player);
    if (d < R) { const a = Math.atan2(player.y - p.y, player.x - p.x); const pull = 420; p.vx += Math.cos(a) * pull * dt; p.vy += Math.sin(a) * pull * dt; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.pow(0.02, dt); p.vy *= Math.pow(0.02, dt);
    if (d < player.r + p.r + 4) {
      if (p.type === "coin") { G.runCoins += p.value; save.coins += p.value; persist(); Sfx.coin(); }
      else { healPlayer(12, true); Sfx.pick(); }
      pickups.splice(i, 1); continue;
    }
    if (p.life <= 0) pickups.splice(i, 1);
  }
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.pow(0.06, dt); p.vy *= Math.pow(0.06, dt);
    p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.y += f.vy * dt; f.vy += 90 * dt; f.life -= dt;
    if (f.life <= 0) floats.splice(i, 1);
  }
  for (let i = effects.length - 1; i >= 0; i--) {
    const f = effects[i]; f.life -= dt;
    if (f.life <= 0) effects.splice(i, 1);
  }
}
/* ======================= 开局 / 房间流程 ======================= */
function startRun(chapter, level, endless) {
  G.chapter = chapter; G.level = level; G.endless = !!endless; G.endlessWave = endless ? 1 : 0;
  G.weapon = save.weapon;
  RUN.skills = {}; RUN.kills = 0; RUN.revived = false;
  G.runCoins = 0; G.runKills = 0; G.runTime = 0;
  G.pendingLevelUps = 0;
  player = createPlayer();
  player.level = 1; player.exp = 0;
  refreshStats(false);
  player.hp = player.maxHp;
  G.revivesLeft = save.perm.revive;
  arrows = []; ebullets = []; enemies = []; pickups = []; parts = []; floats = []; effects = [];
  G.rooms = endless ? buildEndlessRooms(1) : buildLevel(chapter, level);
  G.room = 0;
  G.state = "playing";
  bossIntro = null;
  loadRoom();
  hideOverlay();
  el.hud.classList.remove("hidden");
  el.btnDash.classList.toggle("hidden", player.st.dash <= 0);
  layoutSkillBar(); layoutHud();
  toast((endless ? "无尽模式 · 第 1 波" : chapterName(chapter) + " " + chapter + "-" + level), 1500);
}
function chapterName(ch) { const c = CHAPTERS[(ch - 1) % CHAPTERS.length]; return c ? c.name : "深渊"; }
function roomTier() {
  return G.endless ? tierOf(1 + Math.floor(G.endlessWave / 8) % 3, 1 + (G.endlessWave % 8), G.endlessWave) : tierOf(G.chapter, G.level, 0);
}
function loadRoom() {
  enemies.length = 0; ebullets.length = 0; arrows.length = 0; pickups.length = 0;
  G.waveIdx = 0; G.waveDelay = 0; G.roomClear = false; G.roomClearTimer = 0;
  const r = G.rooms[G.room];
  const st = player.st;
  if (st.shieldMax > 0) player.shield = st.shieldMax;
  const b = BOUND();
  player.x = clamp(V.w / 2, b.l + 30, b.r - 30);
  player.y = clamp(V.h * 0.72, b.t + 30, b.b - 30);
  player.invuln = 1.0;
  if (r.boss) {
    spawnBoss(r.boss, roomTier());
  } else {
    spawnWave(0);
  }
  updateRoomText();
}
function spawnWave(idx) {
  const r = G.rooms[G.room];
  if (!r.waves || !r.waves[idx]) return;
  const tier = r.tier !== undefined ? r.tier : roomTier();
  const elite = r.kind === "elite";
  for (const grp of r.waves[idx]) {
    for (let i = 0; i < grp.n; i++) {
      if (enemies.length >= MAX_ENEMIES) break;
      const e = spawnEnemy(grp.t, { tier: tier, elite: elite && Math.random() < 0.4 });
      e.atkT = rand(0.5, 1.8);
    }
  }
  if (idx > 0) toast("第 " + (idx + 1) + " 波敌人！", 900);
}
function updateRoomText() {
  const r = G.rooms[G.room];
  const total = G.rooms.length;
  if (r && r.boss) el.roomTxt.textContent = "⚠️ BOSS 房间";
  else el.roomTxt.textContent = "房间 " + (G.room + 1) + "/" + total + (r && r.kind === "elite" ? " · 精英" : "");
  el.stageTxt.textContent = G.endless ? "无尽 · 第 " + G.endlessWave + " 波" : chapterName(G.chapter) + " " + G.chapter + "-" + G.level;
}
function checkRoomFlow(dt) {
  if (G.roomClear) {
    G.roomClearTimer -= dt;
    if (G.roomClearTimer <= 0) nextRoom();
    return;
  }
  if (enemies.length === 0) {
    const r = G.rooms[G.room];
    const waves = (r.waves || []).length;
    if (G.waveIdx + 1 < waves) {
      G.waveDelay -= dt;
      if (G.waveDelay <= 0) { G.waveIdx++; spawnWave(G.waveIdx); }
      return;
    }
    // 房间清空
    G.roomClear = true;
    const tier = roomTier();
    const reward = Math.round((12 + tier * 2.2) * (r.kind === "elite" ? 2.2 : 1) * (r.boss ? 3.2 : 1));
    G.runCoins += reward; save.coins += reward; persist(true);
    player.shield = player.st.shieldMax;
    // 房间清空回血，缓解跨房间消耗
    if (player.hp < player.maxHp) healPlayer(Math.round(player.maxHp * 0.08), false);
    Sfx.clear();
    toast("房间清空！ +" + reward + " 🪙", 1200);
    if (Math.random() < 0.35) dropPickup(player.x + rand(-40, 40), player.y + rand(-40, 40), "heart", 1);
    G.roomClearTimer = 1.15;
  }
}
function nextRoom() {
  if (G.endless) {
    G.endlessWave++;
    G.rooms = buildEndlessRooms(G.endlessWave);
    G.room = 0;
    player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.18);
    toast("第 " + G.endlessWave + " 波", 1300);
    loadRoom();
    return;
  }
  if (G.room + 1 < G.rooms.length) {
    G.room++;
    loadRoom();
    return;
  }
  levelCleared();
}
function levelCleared() {
  G.state = "clear";
  const key = G.chapter + "-" + G.level;
  const first = !save.progress[key];
  save.progress[key] = true;
  let bonus = Math.round(60 + tierOf(G.chapter, G.level, 0) * 8);
  if (first) bonus = Math.round(bonus * 1.5);
  save.coins += bonus; G.runCoins += bonus;
  if (G.chapter >= (save.unlocked._max || 1)) save.unlocked._max = G.chapter;
  const nxt = G.level + 1;
  if (nxt > CHAPTER_MAX_LEVEL) {
    save.unlocked[G.chapter + 1] = save.unlocked[G.chapter + 1] || 1;
    save.unlocked._max = Math.max(save.unlocked._max || 1, G.chapter + 1);
  } else {
    save.unlocked[G.chapter] = Math.max(save.unlocked[G.chapter] || 1, nxt);
  }
  if (tierOf(G.chapter, G.level, 0) >= 20) save.endlessUnlocked = true;
  save.best = Math.max(save.best, tierOf(G.chapter, G.level, 0));
  persist(true);
  Sfx.clear();
  showVictory(bonus);
}
function endlessGameOver() {
  G.state = "dead";
  save.endlessBest = Math.max(save.endlessBest || 0, G.endlessWave);
  persist(true);
  showDefeat(true);
}

/* ======================= HUD ======================= */
let skillBarSig = "";

function layoutHud() { }
function updateHud() {
  if (!player) return;
  const hp = Math.max(0, player.hp), mx = player.maxHp;

/* ======================= 主循环 ======================= */
let lastT = performance.now();
function frame(now) {
  const rawDt = Math.min(0.034, Math.max(0.0001, (now - lastT) / 1000));
  lastT = now;
  G.dt = rawDt;
  if (G.state === "playing") {
    G.time += rawDt;
    G.runTime += rawDt;
    updatePlayer(rawDt);
    updateArrows(rawDt);
    updateEnemies(rawDt);
    updateEBullets(rawDt);
    updatePickups(rawDt);
    updateParts(rawDt);
    checkRoomFlow(rawDt);
    updateHud();
    if (G.shake > 0) G.shake = Math.max(0, G.shake - rawDt * 42);
  } else {
    updateParts(rawDt * 0.4);
    if (G.shake > 0) G.shake = Math.max(0, G.shake - rawDt * 30);
  }
  render();
  requestAnimationFrame(frame);
}

/* ======================= 暂停 / 继续 ======================= */
function pauseGame() {
  if (G.state !== "playing") return;

}
function resumeGame() {
  if (G.state !== "paused") return;
  G.state = "playing";
  lastT = performance.now();
  hideOverlay();
}
el.btnPause.addEventListener("click", pauseGame);
el.btnDash.addEventListener("pointerdown", (e) => { e.preventDefault(); doDash(); });
/* ======================= 渲染 ======================= */
let bgCache = { w: 0, h: 0, ch: -1, grad: null };
function themeColors() {
  const c = CHAPTERS[(G.chapter - 1) % CHAPTERS.length] || CHAPTERS[0];
  if (G.endless) return { base: "#1a1030", accent: "#c9a2ff", line: "#4a3a7a", name: "无尽" };
  return { base: c.color, accent: c.accent, line: "#ffffff18", name: c.name };
}
function render() {
  const w = V.w, h = V.h;

function enemyShape(e) {

    ctx2d.beginPath();

  } else if (e.ai === "turret") {

    "<b style='color:#ffd479'>操作</b><br>· 手机：<b>按住屏幕任意位置拖动</b>出现摇杆，角色自动朝最近敌人射箭<br>" +
    "· 电脑：<span class='kbd'>WASD</span>/<span class='kbd'>方向键</span> 移动，<span class='kbd'>空格</span> 冲刺，<span class='kbd'>P</span> 暂停<br>" +
    "· 获得「疾影冲刺」技能后，右下角出现冲刺按钮（冲刺期间无敌）<br><br>" +
    "<b style='color:#ffd479'>闯关</b><br>· 每个小关 3~5 个房间，清空房间即可前进；每 5 关是 <b>BOSS 房</b><br>" +
    "· 击杀敌人获得经验，<b>升级时从 3 张卡中选 1 个技能</b>，技能可以叠加成型<br>" +
    "· 死亡结束本局，金币保留，可在「强化 &amp; 武器」里永久变强<br>" +
    "· 通关第 3 章后解锁 <b>无尽模式</b>，无限波次挑战最高纪录<br><br>" +
    "<b style='color:#ffd479'>流派提示</b><br>· 多重射击 + 穿透 + 弹射 = 箭雨清屏<br>" +
    "· 烈焰 + 寒冰 + 爆裂 = 元素爆发<br>" +
    "· 吸血 + 荆棘 + 护盾 = 近战硬抗<br>" +
    "· 疾影冲刺 + 幻影身法 = 无伤走位" +
    "</div></div>" +
    '<button class="btn primary" id="hBack">返回</button>'
  );
  $("hBack").onclick = showMenu;
}
function showLevelSelect() {
  const chs = CHAPTERS;
  let tabs = "", grid = "", selCh = clamp(save.chapter, 1, chs.length), selLv = save.level;
  const unlockedCh = (c) => !!save.unlocked[c];
  for (const c of chs) {
    tabs += '<div class="tab' + (c.id === selCh ? " on" : "") + '" data-ch="' + c.id + '"' + (unlockedCh(c.id) ? "" : ' style="opacity:.45"') + ">" + c.name + "</div>";
  }
  for (let lv = 1; lv <= CHAPTER_MAX_LEVEL; lv++) {
    const key = selCh + "-" + lv;
    const maxUnlocked = save.unlocked[selCh] || 0;
    const locked = lv > maxUnlocked;
    const done = !!save.progress[key];
    const boss = BOSS_LEVELS.indexOf(lv) >= 0;
    grid += '<div class="lvcell' + (locked ? " locked" : "") + (done ? " done" : "") + (boss ? " boss" : "") + '" data-ch="' + selCh + '" data-lv="' + lv + '">' +
      (boss ? "👑" : lv) + "<small>" + (locked ? "🔒" : done ? "已通关" : "挑战") + "</small></div>";
  }
  const wl = Object.keys(WEAPONS).map((id) => {
    const w = WEAPONS[id], owned = !!save.weapons[id];
    return '<div class="item" style="cursor:pointer" data-w="' + id + '">' +
      '<div class="ic">' + w.icon + "</div><div class='tx'><div class='nm'>" + w.name + (save.weapon === id ? " ✅" : "") + "</div>" +
      "<div class='ds'>" + w.desc + "</div></div>" +
      '<div class="pill' + (owned ? "" : " off") + '">' + (owned ? (save.weapon === id ? "使用中" : "装备") : "🪙" + w.cost) + "</div></div>";
  }).join("");
  showOverlay(
    '<h1 class="title" style="font-size:24px">关卡选择</h1>' +
    '<div class="tabs">' + tabs + "</div>" +
    '<div class="panel"><div class="grid-lv">' + grid + "</div></div>" +
    '<div class="panel"><h2>武器（点击装备 / 购买）</h2><div class="list">' + wl + "</div></div>" +
    (save.endlessUnlocked ? '<button class="btn primary" id="lEndless">♾ 无尽模式（最高 ' + (save.endlessBest || 0) + " 波）</button>" : "") +
    '<div class="row"><button class="btn ghost" id="lBack">返回</button></div>' +
    '<div class="tip">💡 关卡与金币永久保存，随时回来继续变强</div>'
  );
  overlay.querySelectorAll(".tab").forEach((t) => t.onclick = () => {
    selCh = +t.dataset.ch;
    if (!save.unlocked[selCh]) { toast("尚未解锁该章节"); return; }
    save.chapter = selCh; save.level = Math.max(1, Math.min(save.unlocked[selCh] || 1, CHAPTER_MAX_LEVEL));
    persist(); showLevelSelect();
  });
  overlay.querySelectorAll(".lvcell").forEach((c) => c.onclick = () => {
    if (c.classList.contains("locked")) { toast("先通关前面的关卡"); return; }
    const ch = +c.dataset.ch, lv = +c.dataset.lv;
    save.chapter = ch; save.level = lv; persist();
    startRun(ch, lv, false);
  });
  overlay.querySelectorAll("[data-w]").forEach((n) => n.onclick = () => {
    const id = n.dataset.w, w = WEAPONS[id];
    if (save.weapons[id]) { save.weapon = id; persist(); toast("已装备 " + w.name); showLevelSelect(); }
    else if (save.coins >= w.cost) { save.coins -= w.cost; save.weapons[id] = 1; save.weapon = id; persist(true); Sfx.levelup(); toast("购买成功！已装备 " + w.name); showLevelSelect(); }
    else toast("金币不足，还差 " + (w.cost - save.coins) + " 🪙");
  });
  if ($("lEndless")) $("lEndless").onclick = () => startRun(1, 1, true);
  $("lBack").onclick = showMenu;
}
function showShop() {
  const pl = PERMS.map((p) => {
    const lv = save.perm[p.id] || 0, max = lv >= p.max, cost = p.cost(lv);
    return '<div class="item"><div class="ic">' + p.icon + "</div>" +
      "<div class='tx'><div class='nm'>" + p.name + " <span style='color:#8ea0c0;font-size:11px'>Lv." + lv + "/" + p.max + "</span></div>" +
      "<div class='ds'>" + p.desc + "</div></div>" +
      '<div class="pill' + (max ? " off" : "") + '" data-p="' + p.id + '" style="cursor:pointer">' + (max ? "已满级" : "🪙 " + cost) + "</div></div>";
  }).join("");
  showOverlay(
    '<h1 class="title" style="font-size:24px">强化 &amp; 武器</h1>' +
    '<div class="subtitle">当前硬币 ' + coinStr() + "</div>" +
    '<div class="panel"><h2>永久强化（每局生效）</h2><div class="list">' + pl + "</div></div>" +
    '<div class="row"><button class="btn ghost" id="sLevels">🗺 关卡选择</button><button class="btn primary" id="sBack">返回</button></div>' +
    '<div class="tip">金币来自每局战斗与房间清空，死亡也不会丢失</div>'
  );
  overlay.querySelectorAll("[data-p]").forEach((n) => n.onclick = () => {
    const p = PERMS.find((x) => x.id === n.dataset.p);
    const lv = save.perm[p.id] || 0;
    if (lv >= p.max) return;
    const cost = p.cost(lv);
    if (save.coins < cost) { toast("金币不足，还差 " + (cost - save.coins) + " 🪙"); return; }
    save.coins -= cost; save.perm[p.id] = lv + 1; persist(true); Sfx.pick(); toast(p.name + " 提升到 Lv." + (lv + 1)); showShop();
  });
  $("sLevels").onclick = showLevelSelect;
  $("sBack").onclick = showMenu;
}
/* ---------------- 升级三选一 ---------------- */
function rollChoices(n) {
  const s = computeStats();
  const pool = SKILLS.filter((sk) => {
    const cnt = RUN.skills[sk.id] || 0;
    if (cnt >= sk.max) return false;
    if (sk.req && !sk.req(s)) return false;
    if (sk.id === "dash" && (RUN.skills.dash || 0) >= 1) return false;
    return true;
  });
  const out = [];
  const wOf = (sk) => (sk.r === 1 ? 100 : sk.r === 2 ? 46 : 15) * (1 + (RUN.skills[sk.id] || 0) * -0.08);
  const tmp = pool.slice();
  while (out.length < n && tmp.length) {
    let total = 0; for (const sk of tmp) total += wOf(sk);
    let r = Math.random() * total, chosen = tmp[0];
    for (const sk of tmp) { r -= wOf(sk); if (r <= 0) { chosen = sk; break; } }
    out.push(chosen); tmp.splice(tmp.indexOf(chosen), 1);
  }
  if (player.hp < player.maxHp * 0.55 && out.length && Math.random() < 0.55) out[out.length - 1] = HEAL_CARD;
  return out;
}
function openLevelUp() {
  G.state = "levelup";
  Input.end();
  Sfx.levelup(); haptic(30);
  const cards = rollChoices(3);
  let html = '<h1 class="title" style="font-size:24px">升 级 ！</h1><div class="subtitle">Lv.' + player.level + " · 选择一个强化</div><div class='cards'>";
  cards.forEach((c, i) => {
    const cnt = RUN.skills[c.id] || 0;
    html += '<div class="card r' + (c.r || 1) + '" data-i="' + i + '">' +
      '<div class="ic">' + c.icon + "</div>" +
      '<div class="nm">' + c.name + "</div>" +
      '<div class="ds">' + c.desc + "</div>" +
      '<div class="rr">' + (c.id === "heal" ? "恢复" : (cnt > 0 ? "已拥有 ×" + cnt : c.r === 3 ? "传说" : c.r === 2 ? "稀有" : "普通")) + "</div></div>";
  });
  html += "</div>";
  showOverlay(html, true);
  overlay.querySelectorAll(".card").forEach((n) => n.onclick = () => pickCard(cards[+n.dataset.i]));
}
function pickCard(c) {
  if (c.id === "heal") healPlayer(player.maxHp * 0.35, true);
  else {
    RUN.skills[c.id] = (RUN.skills[c.id] || 0) + 1;
    refreshStats(true);
    if (c.id === "hp") healPlayer(18, false);
    if (c.id === "dash") { el.btnDash.classList.remove("hidden"); }
  }
  Sfx.pick(); haptic(14);
  G.pendingLevelUps = Math.max(0, (G.pendingLevelUps || 0) - 1);
  layoutSkillBar();
  if (G.pendingLevelUps > 0) { openLevelUp(); return; }
  G.state = "playing";
  lastT = performance.now();
  hideOverlay();
}
function showPause() {
  showOverlay(
    '<h1 class="title" style="font-size:26px">暂 停</h1>' +
    '<div class="panel" style="text-align:center"><div style="font-size:12px;line-height:2;color:#c9d7f0">' +
    "关卡：" + (G.endless ? "无尽 第 " + G.endlessWave + " 波" : chapterName(G.chapter) + " " + G.chapter + "-" + G.level) + "<br>" +
    "本局金币：<b style='color:#ffd479'>" + G.runCoins + "</b>　击杀：" + RUN.kills + "<br>" +
    "已获得技能：" + (Object.keys(RUN.skills).length || 0) + " 种</div></div>" +
    '<div class="row" style="flex-direction:column">' +
    '<button class="btn primary" id="pResume">▶ 继续</button>' +
    '<button class="btn ghost" id="pRestart">🔄 重开本关</button>' +
    '<button class="btn ghost" id="pQuit">🏠 放弃并返回</button>' +
    "</div>"
  );
  $("pResume").onclick = resumeGame;
  $("pRestart").onclick = () => startRun(G.chapter, G.level, G.endless);
  $("pQuit").onclick = () => { G.state = "menu"; hideOverlay(); showMenu(); };
}
function showVictory(bonus) {
  el.hud.classList.add("hidden");
  const nextLv = G.level + 1;
  const hasNext = nextLv <= CHAPTER_MAX_LEVEL;
  showOverlay(
    '<h1 class="title" style="font-size:28px">通 关 ！</h1>' +
    '<div class="subtitle">' + chapterName(G.chapter) + " " + G.chapter + "-" + G.level + "</div>" +
    '<div class="panel" style="text-align:center"><div style="font-size:13px;line-height:2.1;color:#c9d7f0">' +
    "通关奖励　<b style='color:#ffd479'>+" + bonus + " 🪙</b><br>" +
    "本局金币合计　<b style='color:#ffd479'>" + G.runCoins + " 🪙</b><br>" +
    "击杀敌人　<b>" + RUN.kills + "</b>　·　获得技能　<b>" + Object.keys(RUN.skills).length + "</b> 种<br>" +
    "用时　<b>" + Math.floor(G.runTime) + " 秒</b>" +
    "</div></div>" +
    '<div class="row" style="flex-direction:column">' +
    (hasNext ? '<button class="btn primary" id="vNext">▶ 下一关 ' + G.chapter + "-" + nextLv + "</button>" : '<button class="btn primary" id="vNextCh">▶ 进入下一章</button>') +
    '<div class="row">' +
    '<button class="btn ghost" id="vShop">⚒ 强化 &amp; 武器</button>' +
    '<button class="btn ghost" id="vMenu">🏠 主菜单</button>' +
    "</div></div>"
  );
  if (hasNext) $("vNext").onclick = () => startRun(G.chapter, nextLv, false);
  else $("vNextCh").onclick = () => startRun(Math.min(G.chapter + 1, CHAPTERS.length), 1, false);
  $("vShop").onclick = showShop;
  $("vMenu").onclick = showMenu;
}
function showDefeat(endless) {
  el.hud.classList.add("hidden");
  showOverlay(
    '<h1 class="title" style="font-size:28px;background:linear-gradient(180deg,#ffc9c9,#ff4d63 60%,#8a1024);-webkit-background-clip:text;background-clip:text;color:transparent">你 倒 下 了</h1>' +
    '<div class="subtitle">' + (endless ? "无尽模式 · 第 " + G.endlessWave + " 波" : chapterName(G.chapter) + " " + G.chapter + "-" + G.level) + "</div>" +
    '<div class="panel" style="text-align:center"><div style="font-size:13px;line-height:2.1;color:#c9d7f0">' +
    "本局金币已保留　<b style='color:#ffd479'>+" + G.runCoins + " 🪙</b><br>" +
    "击杀敌人　<b>" + RUN.kills + "</b>　·　获得技能　<b>" + Object.keys(RUN.skills).length + "</b> 种<br>" +
    "用时　<b>" + Math.floor(G.runTime) + " 秒</b>" +
    "</div></div>" +
    '<div class="row" style="flex-direction:column">' +
    '<button class="btn primary" id="dRetry">🔄 再来一次</button>' +
    '<div class="row">' +
    '<button class="btn ghost" id="dShop">⚒ 强化变强</button>' +
    '<button class="btn ghost" id="dMenu">🏠 主菜单</button>' +
    "</div></div>" +
    '<div class="tip">💡 提示：先去商店把金币花掉，攻击/生命/复活都会永久提升</div>'
  );
  $("dRetry").onclick = () => startRun(G.chapter, G.level, G.endless);
  $("dShop").onclick = showShop;
  $("dMenu").onclick = showMenu;
}

/* ======================= 启动 ======================= */
requestAnimationFrame(frame);
resize();
showMenu();

</script>
